packages:
  - 'packages/*'
  - 'sites/*'
  - 'starter'
# The committed lockfile may only pin versions public for >=24h; set explicitly so the gate also applies on a machine whose global pnpm config disables it.
minimumReleaseAge: 1440
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  workerd: true
