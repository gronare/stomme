                          - { name: title, label: "Title", widget: string }
                          - { name: body, label: "Text", widget: string, required: false }
                  - name: layout
                    label: "Layout"
                    widget: object
                    collapsed: true
                    hint: "Size and placement — rarely needs changing."
                    fields:
                      - name: height
                        label: "Height"
                        widget: select
                        required: false
                        default: "normal"
                        hint: "Tall fills the screen — best with a Gradient or Dark background."
