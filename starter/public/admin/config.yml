  - name: faq
    media_folder: "/public/media/faq"
    public_folder: "/media/faq"
    label: "FAQ"
    label_singular: "Question"
    folder: "src/content/faq"
    create: true
    reorder: true
    summary: "{{fields.question}}"
    slug: "{{slug}}"
    fields:
      - { name: question, label: "Question", widget: string }
      - { name: answer, label: "Answer", widget: text }
      - { name: order, widget: hidden, required: false, default: 0 }
      - { name: tags, label: "Tags", widget: relation, collection: faq-tags, multiple: true, value_field: "{{title}}", display_fields: ["{{title}}"], search_fields: [title], required: false, hint: "Scope the question to pages: an FAQ block filtered on a tag (e.g. a service or town) shows every question carrying it. Pick a tag or add a new one right in the field." }
  - name: faq-tags
    label: "FAQ tags"
    label_singular: "Tag"
    folder: "src/content/faq-tags"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Tag", widget: string }
  - name: testimonials
    media_folder: "/public/media/testimonials"
    public_folder: "/media/testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "src/content/testimonials"
    create: true
    reorder: true
    summary: "{{fields.name}}"
    slug: "{{slug}}"
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role / company", widget: string, required: false }
      - { name: quote, label: "Quote", widget: text }
      - { name: order, widget: hidden, required: false, default: 0 }
