field_defaults:
  richtext:
    editor_components: [code-block, image, stomme-section]
output:
  omit_empty_optional_fields: true
# >>> cms:generated (run: pnpm cms:gen — do not edit between markers)
backend:
  name: github
  repo: local/stomme-starter
  branch: main
# <<< cms:generated
media_folder: "/public/media"
public_folder: "/media"
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image: { format: webp, quality: 82, width: 2048, height: 2048 }
      svg: { optimize: true }
collections:
  # >>> collections:generated (run: pnpm cms:gen — do not edit between markers)
  - name: home
    media_folder: "/public/media/home"
    public_folder: "/media/home"
    label: "Home page"
    files:
      - name: home
        label: "Home"
        file: "src/content/home/home.md"
        fields:
          - name: seo
            label: "SEO"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "SEO title", widget: string }
              - { name: description, label: "SEO description", widget: text }
          - name: blocks
            label: "Sections · build the page (drag to reorder)"
            label_singular: "Section"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.eyebrow}} {{fields.heading}}{{fields.quote}}"
            types:
              - name: hero
                label: "Hero"
                widget: object
                description: "Full-width intro — eyebrow, H1, text and a button, with an optional image, highlights list or animated motif beside it."
                fields:
                  - { name: eyebrow, label: "Eyebrow", widget: string, required: false, hint: "Small uppercase label above the heading." }
                  - { name: heading, label: "Heading (H1)", widget: string }
                  - { name: intro, label: "Intro", widget: text, required: false }
                  - name: ticks
                    label: "Ticks (checkmark lines)"
                    widget: list
                    required: false
                    label_singular: "Line"
                    collapsed: true
                    hint: "Short ✓ lines under the intro — key reassurances."
                    field: { name: text, label: "Line", widget: string }
                  - name: cta
                    label: "Button"
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.label}}"
                    fields:
                      - { name: label, label: "Label", widget: string }
                      - name: link
                        label: "Link"
                        widget: object
                        collapsed: false
                        fields:
                          - name: page
                            label: "Page"
                            widget: select
                            required: false
                            hint: "Pick a page on the site."
                            options:
                              - { label: "— No page —", value: "" }
                              - { label: "Home (/)", value: "/" }
                              - { label: "About (/about)", value: "/about" }
                              - { label: "Contact (/contact)", value: "/contact" }
                              - { label: "Build (/services/garden-build)", value: "/services/garden-build" }
                              - { label: "Care (/services/garden-care)", value: "/services/garden-care" }
                              - { label: "Design (/services/garden-design)", value: "/services/garden-design" }
                              - { label: "Planting (/services/planting)", value: "/services/planting" }
                          - { name: url, label: "…or a custom URL", widget: string, required: false, hint: "External link, tel: or mailto:. Used if filled." }
                  - name: cta2
                    label: "Second button"
                    widget: object
                    required: false
                    collapsed: true
                    summary: "{{fields.label}}"
                    hint: "Shown as a quiet text link beside the button."
                    fields:
                      - { name: label, label: "Label", widget: string }
                      - name: link
                        label: "Link"
                        widget: object
                        collapsed: false
                        fields:
                          - name: page
                            label: "Page"
                            widget: select
                            required: false
                            hint: "Pick a page on the site."
                            options:
                              - { label: "— No page —", value: "" }
                              - { label: "Home (/)", value: "/" }
                              - { label: "About (/about)", value: "/about" }
                              - { label: "Contact (/contact)", value: "/contact" }
                              - { label: "Build (/services/garden-build)", value: "/services/garden-build" }
                              - { label: "Care (/services/garden-care)", value: "/services/garden-care" }
                              - { label: "Design (/services/garden-design)", value: "/services/garden-design" }
                              - { label: "Planting (/services/planting)", value: "/services/planting" }
                          - { name: url, label: "…or a custom URL", widget: string, required: false, hint: "External link, tel: or mailto:. Used if filled." }
                  - { name: command, label: "Command", widget: string, required: false, hint: "A one-line shell command shown in monospace with a copy button, e.g. an install command." }
                  - name: media
                    label: "Media"
                    widget: object
                    collapsed: true
                    summary: "{{fields.kind}}"
                    hint: "What shows beside the text. Default: none."
                    fields:
                      - name: kind
                        label: "Show"
                        widget: select
                        required: false
                        default: "none"
                        hint: "What shows beside the heading: none, image, video, highlights or motif."
                        options:
                          - { label: "None (text only)", value: "none" }
                          - { label: "Image", value: "image" }
                          - { label: "Video (looping, muted)", value: "video" }
                          - { label: "Highlights (icon + title + line)", value: "highlights" }
                          - { label: "Motif (animated, no image)", value: "motif" }
                      - { name: image, label: "Image", widget: image, required: false, hint: "Used when Show = Image, and as the poster when Show = Video." }
                      - { name: imageAlt, label: "Image alt text", widget: string, required: false, hint: "Describe the image for screen readers and search engines." }
                      - { name: video, label: "Video file (MP4)", widget: file, required: false, hint: "Used when Show = Video. Plays muted and looping; the image above is the poster, and the only thing shown to visitors who ask for reduced motion." }
                      - { name: videoWebm, label: "Video file (WebM)", widget: file, required: false, hint: "Optional second encoding of the same video. Browsers that play WebM pick it first." }
                      - { name: videoUrl, label: "…or video URL", widget: string, required: false, hint: "External MP4/WebM URL. Used instead of an uploaded file if filled." }
                      - name: ratio
                        label: "Shape"
                        widget: select
                        required: false
                        default: "standard"
                        hint: "The shape the image or video is shown in. Wide suits screenshots."
                        options:
                          - { label: "Standard (4:3)", value: "standard" }
                          - { label: "Wide (16:9)", value: "wide" }
                          - { label: "Square", value: "square" }
                      - name: highlights
                        label: "Highlights"
                        widget: list
                        required: false
                        label_singular: "Key point"
                        collapsed: true
                        hint: "Panel with icon + title + line. Used when Show = Highlights."
                        summary: "{{fields.title}}"
                        fields:
                          - name: icon
                            label: "Icon"
                            widget: select
                            required: false
                            hint: "Optional icon."
                            options:
                              - { label: "check", value: "check" }
                              - { label: "star", value: "star" }
                              - { label: "heart", value: "heart" }
                              - { label: "spark", value: "spark" }
                              - { label: "sparkles", value: "sparkles" }
                              - { label: "arrow", value: "arrow" }
                              - { label: "search", value: "search" }
