  - name: pages
    media_folder: "/public/media/pages/{{slug}}"
    public_folder: "/media/pages/{{slug}}"
    label: "Pages"
    label_singular: "Page"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.published | ternary('{{fields.title}}', '{{fields.title}} · Unpublished')}}"
    view_filters:
      - { name: unpublished, label: "Unpublished", field: published, ne: true }
    view_groups:
      groups:
        - { name: parent, label: "Parent page", field: parent }
    fields:
      - { name: published, label: "Published", widget: boolean, default: false, required: false, hint: "Off: the page is not built, so its address shows the 404 page, and it is left out of automatic submenus, subpage lists and the sitemap. A menu link added by hand stays, so remove that too." }
      - { name: title, label: "Title", widget: string }
      - name: parent
        label: "Parent page"
        widget: select
        required: false
        hint: "The address nests under the page you pick. A page under /services answers on /services/its-own-name. Empty means a top-level page."
        options:
          - { label: "— No page —", value: "" }
          - { label: "Home (/)", value: "/" }
          - { label: "About (/about)", value: "/about" }
          - { label: "Contact (/contact)", value: "/contact" }
          - { label: "Build (/services/garden-build)", value: "/services/garden-build" }
          - { label: "Care (/services/garden-care)", value: "/services/garden-care" }
