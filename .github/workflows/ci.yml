name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The regression net: a broken block, a type error or a failing image/Astro build shows up here.
  sites:
    name: build + check (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site:
          - starter
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: astro check (types)
        working-directory: ${{ matrix.site }}
        run: pnpm exec astro check
      - name: build (cms:gen + astro build)
        working-directory: ${{ matrix.site }}
        run: pnpm run build

  # astro check runs from starter/ and reaches the engine through node_modules, where TypeScript reports nothing — the engine's own sources are only checked here.
  engine-types:
    name: engine typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit (packages/stomme)
        run: pnpm --filter @gronare/stomme typecheck

      # The comment rule the engine is written to: one line each, English. A line that stops mid-sentence is a wrapped block; two adjacent one-liners about unrelated things stay legal. The starter is out of scope on purpose — its config carries reader-facing documentation.
      - name: unit + contract suites
        run: pnpm --filter @gronare/stomme run test:units


  # Catches what the Node dev server cannot: decoding ?data= with Node's Buffer, absent on workerd, empties #preview-root on every deployed site. HTTP checks only — the CSP detector needs Playwright and runs locally.
  preview-workerd:
    name: preview smoke (workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The script builds:cloudflare + serves dist/ on workerd + asserts /preview.
      - name: smoke /preview on workerd
        run: pnpm --filter @gronare/stomme test:preview-workerd -- --no-csp

  # A site with no slots dir builds identically with or without these seams, so a regression here stays invisible until a downstream extension breaks.
  addon-seams:
    name: addon seams (slots + routes + blocks + CMS panes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: route-manifest injection
        run: pnpm --filter @gronare/stomme test:addon-routes
      - name: CMS-pane manifest
        run: pnpm --filter @gronare/stomme test:addon-cms
      - name: block registry
        run: pnpm --filter @gronare/stomme test:addon-blocks
      - name: slot mounting + gating
        run: pnpm --filter @gronare/stomme test:slots

  # Engine behaviour no build failure would surface: generated share cards, the unlisted-path rules behind noindex, and the middleware that makes /admin a working dev address.
  engine-smokes:
    name: engine smokes (og + noindex + public index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: share-card rendering
        run: pnpm --filter @gronare/stomme test:og
      - name: unlisted paths
        run: pnpm --filter @gronare/stomme test:noindex
      - name: public directory index
        run: pnpm --filter @gronare/stomme test:public-index

  # The Sveltia DOM contract test is deliberately not per-PR: between version bumps the pinned DOM does not change, so it runs when the pin is bumped instead.

  # node --check on the plain-JS scripts — none of these go through astro check.
  engine-scripts:
    name: engine scripts syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: node --check
        run: |
          node --check packages/stomme/bin/gen-admin-blocks.mjs
          node --check packages/stomme/bin/new-block.mjs
          node --check packages/stomme/integration.mjs
          node --check packages/stomme/admin/previews.js
          node --check packages/stomme/test/smoke-preview-workerd.mjs

  # The manifests are published artifacts: tooling reads them raw at a tagged ref to check
  # site content against the engine's schema. One that lags its generator (collections.ts /
  # catalog.ts) reports wrong answers, so regenerate both and fail on any diff — every ref
  # carries manifests matching the code at that ref.
  manifests-fresh:
    name: manifests fresh (schema + blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: regenerate manifests
        run: |
          pnpm --filter @gronare/stomme gen:schema-manifest
          pnpm --filter @gronare/stomme gen:blocks-manifest
      - name: committed manifests match their generators
        run: git diff --exit-code -- packages/stomme/schema-manifest.json packages/stomme/blocks-manifest.json
