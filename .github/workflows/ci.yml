name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build + typecheck the starter. This is the regression
  # net: a broken block, a type error, or a failing image/Astro build shows up here.
  sites:
    name: build + check (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site:
          - starter
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: astro check (types)
        working-directory: ${{ matrix.site }}
        run: pnpm exec astro check
      - name: build (cms:gen + astro build)
        working-directory: ${{ matrix.site }}
        run: pnpm run build

  # Production-runtime guard: build the starter with the Cloudflare adapter and
  # serve dist/ on workerd (wrangler pages dev — no deploy), then assert /preview
  # actually renders. Catches the class of bug that is invisible on the Node dev
  # server, e.g. decoding ?data= with Node's Buffer (absent on workerd → an empty
  # #preview-root on every deployed site). Core HTTP checks only — no browser; the
  # optional CSP detector needs Playwright and is run locally (see the script header).
  preview-workerd:
    name: preview smoke (workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The script builds:cloudflare + serves dist/ on workerd + asserts /preview.
      - name: smoke /preview on workerd
        run: pnpm --filter @gronare/stomme test:preview-workerd -- --no-csp

  # The seams an out-of-tree extension mounts on: slots, collections, routes, CMS panes and
  # block types. A site with no slots dir builds identically with or without them, so a
  # regression here stays invisible until a downstream extension breaks.
  addon-seams:
    name: addon seams (slots + routes + blocks + CMS panes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: route-manifest injection
        run: pnpm --filter @gronare/stomme test:addon-routes
      - name: CMS-pane manifest
        run: pnpm --filter @gronare/stomme test:addon-cms
      - name: block registry
        run: pnpm --filter @gronare/stomme test:addon-blocks
      - name: slot mounting + gating
        run: pnpm --filter @gronare/stomme test:slots

  # Engine behaviour that no build failure would surface: generated share cards, the
  # unlisted-path rules behind noindex, and the dev-server middleware that makes /admin a
  # working address.
  engine-smokes:
    name: engine smokes (og + noindex + public index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: share-card rendering
        run: pnpm --filter @gronare/stomme test:og
      - name: unlisted paths
        run: pnpm --filter @gronare/stomme test:noindex
      - name: public directory index
        run: pnpm --filter @gronare/stomme test:public-index

  # NB: the Sveltia DOM contract test (test:admin-contract) is deliberately NOT a
  # per-PR job — between version bumps the pinned Sveltia (and its DOM) doesn't
  # change, so it would be redundant every run. It runs whenever the pin is bumped.

  # Catch syntax errors in the engine's plain-JS scripts (bins, integration,
  # the CMS previews module) — none of these go through astro check.
  engine-scripts:
    name: engine scripts syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: node --check
        run: |
          node --check packages/stomme/bin/gen-admin-blocks.mjs
          node --check packages/stomme/bin/new-block.mjs
          node --check packages/stomme/integration.mjs
          node --check packages/stomme/admin/previews.js
          node --check packages/stomme/test/smoke-preview-workerd.mjs

  # The manifests are published artifacts: tooling reads them raw at a tagged ref to check
  # site content against the engine's schema. One that lags its generator (collections.ts /
  # catalog.ts) reports wrong answers, so regenerate both and fail on any diff — every ref
  # carries manifests matching the code at that ref.
  manifests-fresh:
    name: manifests fresh (schema + blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: regenerate manifests
        run: |
          pnpm --filter @gronare/stomme gen:schema-manifest
          pnpm --filter @gronare/stomme gen:blocks-manifest
      - name: committed manifests match their generators
        run: git diff --exit-code -- packages/stomme/schema-manifest.json packages/stomme/blocks-manifest.json
